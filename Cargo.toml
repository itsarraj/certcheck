[package]
name = "certcheck"
version = "0.1.0"
edition = "2021"
description = "A headless CLI to retrieve a domain's SSL/TLS certificate and output its status"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/certcheck"
readme = "README.md"
keywords = ["ssl", "tls", "certificate", "cli"]
categories = ["command-line-utilities"]

[dependencies]
rustls = "0.21"
webpki-roots = "0.25"
x509-parser = "0.15"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
